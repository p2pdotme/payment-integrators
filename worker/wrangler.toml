name = "paylinks-relayer"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── Secrets ──────────────────────────────────────────────────────────
# Set with `wrangler secret put`, NEVER in this file:
#   LINK_KEY_MASTER          32 random bytes, base64. Wraps per-link keys.
#   WEBHOOK_SIGNING_KEY      HMAC key for outbound webhook signatures
#   SPONSOR_VERIFIER_SECRET  shared with the sponsorship provider
#   TURNSTILE_SECRET         the human-cost gate
#
#   RELAYER_PRIVATE_KEY      DEPRECATED. Delete once link traffic is fully
#                            on the Router. This was the funded key the
#                            review rejected: a single point of failure,
#                            no spending limits, one nonce sequence that
#                            blocks under load.
#
# LINK_KEY_MASTER is what replaces it, and the difference is the point: it
# holds no money, so losing it costs availability rather than funds. It
# should become a handle to a managed key service rather than raw material
# here, so every unwrap is logged and the credential is revocable in
# seconds — a key sitting in configuration can never be un-leaked.

[vars]
# ─── Wiring — must be set before the first payment ────────────────────
CHAIN_ID = "84532"
RPC_URL = "https://sepolia.base.org"
INTEGRATOR_ADDRESS = "0x0000000000000000000000000000000000000000"  # set after deploy
DIAMOND_ADDRESS = "0x0000000000000000000000000000000000000000"
# The LinkRouter, set as the integrator's `trustedRelayer`. Every link
# payment goes through it. It holds nothing, has no admin and no upgrade
# path, and its only reach into custody code is three link calls.
LINK_ROUTER_ADDRESS = "0x0000000000000000000000000000000000000000"  # set after deploy

# ─── Account abstraction ──────────────────────────────────────────────
# The ERC-4337 EntryPoint. Already deployed on Base; do not deploy your own.
ENTRYPOINT_ADDRESS = "0x0000000000071727De22E5E9d8BAf0edAc6f37da"

# The account factory, and WHICH SHAPE it is.
#
# There are two in the wild and they have DIFFERENT SELECTORS:
#   "thirdweb" -> getAddress(address, bytes)    ← hosted accounts
#   "simple"   -> getAddress(address, uint256)  ← the 4337 reference factory
#
# The wrong value does not fail loudly. It calls a function the factory does
# not have, and every local test still passes because the local fixture is the
# reference factory. This shipped wrong once; hence the explicit setting.
ACCOUNT_FACTORY_ADDRESS = "0x0000000000000000000000000000000000000000"  # set from your project
ACCOUNT_FACTORY_KIND = "thirdweb"

# Bundler and sponsorship. These replace the funded relayer AND the nonce
# manager: each link account has its own nonce sequence, so one stuck payment
# cannot block every later one.
BUNDLER_URL = ""   # e.g. https://<chain>.bundler.thirdweb.com/v2/<clientId>
PAYMASTER_URL = "" # usually the same endpoint
PAYMASTER_POLICY_ID = ""

# Sponsored operations allowed per link, over that link's whole life.
#
# This is NOT a provider dashboard setting. The built-in sponsorship rules
# are global only — total spend, chain, and a contract allowlist — so a
# per-link ceiling has to be enforced by our own verifier endpoint
# (/api/sponsor-check). Do not describe it as a checkbox.
#
# What it bounds: cancelling a link order gives the link's use back
# (onOrderCancel does `cl.uses--`), so place-then-cancel can be repeated and
# maxUses caps concurrent orders rather than total attempts. Requiring the
# customer's signature to cancel already stops a stolen link key driving
# that loop alone; this is the backstop for losing both keys.
MAX_SPONSORED_OPS_PER_LINK = "20"
CLIENT_ADDRESS = "0x0000000000000000000000000000000000000000"
# The productId the pinned client prices a single unit at.
# Product 2, NOT 1. scripts/deploy-merchant-terminal.ts prices product 2 at one
# 6-decimal unit and leaves product 1 at zero, so pointing here at 1 makes
# unitPrice() return 0 and every link reports "not payable right now" on a
# fresh deploy. The e2e fixture happens to price product 1, which hid this.
PRODUCT_ID = "2"
# Lock the pay endpoint to your own domains once they are known. Left empty
# the endpoint is open, which is correct for a public pay page.
# Leaving this empty makes corsHeaders fall back to "*", which lets any site
# call /api/pay and /api/relay-tx. Defensible for a public pay page, but it
# should be a deliberate choice at deploy time rather than a default nobody
# revisited. Set your own pay-page origins here before going live.
ALLOWED_ORIGINS = "https://pay.p2p.me"

# ─── Operational limits ───────────────────────────────────────────────
# Every value below is OPTIONAL. Unset, the service uses the defaults in
# src/config.ts (DEFAULT_LIMITS), which are sized from the contract's own
# measured gas report. They live here so an operator can turn a knob during
# an incident without a code change and redeploy.
#
# A malformed value falls back to its default rather than disabling the
# ceiling — a typo must never be the reason a spend cap stops applying.

# Rate limits. A payment link is a public endpoint; these are the first line
# against spam, checked before any RPC call.
RATE_IP_PER_MINUTE = "10"
RATE_LINK_PER_HOUR = "20"

# Gas ceilings. relayerPlaceOrder measures ~348k average, ~398k max — 600k is
# an anomaly detector, not a working limit. The daily cap bounds a spam wave
# to roughly 1,400 payments' worth of gas; at ~$0.01 each that is ~$14/day.
# Ceilings on relayer spend, in WEI. These names must match what config.ts
# reads: they were MAX_GAS_PER_* here and MAX_GAS_WEI_PER_* in the code, so
# every value set here was silently ignored and the defaults applied — the
# worst kind of knob, one that looks connected and is not.
#
# Sized off the FLOAT, not off an assumed gas price. Pricing them at Base's
# usual 0.01 gwei produced ceilings that refused every payment the moment the
# chain reached ~1 gwei.
MAX_GAS_WEI_PER_TX = "1000000000000000"
MAX_GAS_WEI_PER_DAY = "10000000000000000"

# Per-link and per-merchant slices of that daily budget (AUDIT N2).
#
# A global ceiling bounds total spend but not BLAST RADIUS: one IP hammering
# a couple of public links could consume the whole day's float and darken
# every other merchant's link until UTC midnight, which made the control
# built to protect the float the cheapest way to switch the service off.
# 20% and 10% of the day, so it takes five busy merchants to exhaust it and
# no single link can take more than a tenth.
MAX_GAS_WEI_PER_MERCHANT_PER_DAY = "2000000000000000"
MAX_GAS_WEI_PER_LINK_PER_DAY = "1000000000000000"

# Cloudflare Turnstile (AUDIT N2). Placement is anonymous and the relayer
# pays for it, so counters ration the wrong thing — requests are free to an
# attacker and every one that lands costs a real transaction and a real slot
# out of a merchant's daily limit. Turnstile charges for the one resource an
# attacker actually lacks, without asking the customer who they are.
#
# The SECRET goes in via `wrangler secret put TURNSTILE_SECRET` — never here.
# Leave REQUIRE_TURNSTILE unset on testnet so the e2e suite runs; set it to
# "true" in production so a missing secret is a loud 503 rather than an open
# door nobody noticed.
# REQUIRE_TURNSTILE = "true"
# Head-room over the estimate, as a percentage. 120 = +20%.
GAS_BUFFER_PCT = "120"

# Warn while there is still time to act, not once the float is gone.
# 0.015 ETH ~ 4,300 payments of remaining runway.
LOW_BALANCE_WEI = "15000000000000000"

# How long to wait for a receipt before telling the customer their payment is
# still confirming. Raise on a slow RPC; the customer is watching a spinner.
RECEIPT_TIMEOUT_MS = "45000"

# Scheduled job. Blocks scanned per run when looking for completions, and
# webhook deliveries attempted per run — both bounded to finish inside a tick.
LOG_SCAN_BLOCKS = "800"
WEBHOOK_BATCH = "50"

# How long one link is held while a payment is in flight. Long enough to cover
# a slow confirmation, short enough that an abandoned attempt frees the link.
LINK_LOCK_SECONDS = "60"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "LINK_LOCK"
class_name = "LinkLock"

[[durable_objects.bindings]]
name = "NONCE"
class_name = "NonceManager"

# The daily gas ceiling. A Durable Object, not KV: KV is eventually consistent,
# so the read-modify-write this used to be was bypassable by simple concurrency
# — which is exactly the condition the ceiling exists for.
[[durable_objects.bindings]]
name = "GAS_BUDGET"
class_name = "GasBudget"

[[migrations]]
tag = "v1"
new_classes = ["LinkLock", "NonceManager", "GasBudget"]

# Confirms completions on-chain, delivers webhooks, and checks the gas float.
[triggers]
crons = ["*/5 * * * *"]

# ─── Production ───────────────────────────────────────────────────────
# `wrangler deploy --env production`. Only the values that DIFFER from the
# defaults above need repeating here.
[env.production.vars]
CHAIN_ID = "8453"
RPC_URL = "https://mainnet.base.org"
INTEGRATOR_ADDRESS = "0x0000000000000000000000000000000000000000"
DIAMOND_ADDRESS = "0x0000000000000000000000000000000000000000"
# The LinkRouter, set as the integrator's `trustedRelayer`. Every link
# payment goes through it. It holds nothing, has no admin and no upgrade
# path, and its only reach into custody code is three link calls.
LINK_ROUTER_ADDRESS = "0x0000000000000000000000000000000000000000"  # set after deploy

# ─── Account abstraction ──────────────────────────────────────────────
# The ERC-4337 EntryPoint. Already deployed on Base; do not deploy your own.
ENTRYPOINT_ADDRESS = "0x0000000000071727De22E5E9d8BAf0edAc6f37da"

# The account factory, and WHICH SHAPE it is.
#
# There are two in the wild and they have DIFFERENT SELECTORS:
#   "thirdweb" -> getAddress(address, bytes)    ← hosted accounts
#   "simple"   -> getAddress(address, uint256)  ← the 4337 reference factory
#
# The wrong value does not fail loudly. It calls a function the factory does
# not have, and every local test still passes because the local fixture is the
# reference factory. This shipped wrong once; hence the explicit setting.
ACCOUNT_FACTORY_ADDRESS = "0x0000000000000000000000000000000000000000"  # set from your project
ACCOUNT_FACTORY_KIND = "thirdweb"

# Bundler and sponsorship. These replace the funded relayer AND the nonce
# manager: each link account has its own nonce sequence, so one stuck payment
# cannot block every later one.
BUNDLER_URL = ""   # e.g. https://<chain>.bundler.thirdweb.com/v2/<clientId>
PAYMASTER_URL = "" # usually the same endpoint
PAYMASTER_POLICY_ID = ""

# Sponsored operations allowed per link, over that link's whole life.
#
# This is NOT a provider dashboard setting. The built-in sponsorship rules
# are global only — total spend, chain, and a contract allowlist — so a
# per-link ceiling has to be enforced by our own verifier endpoint
# (/api/sponsor-check). Do not describe it as a checkbox.
#
# What it bounds: cancelling a link order gives the link's use back
# (onOrderCancel does `cl.uses--`), so place-then-cancel can be repeated and
# maxUses caps concurrent orders rather than total attempts. Requiring the
# customer's signature to cancel already stops a stolen link key driving
# that loop alone; this is the backstop for losing both keys.
MAX_SPONSORED_OPS_PER_LINK = "20"
CLIENT_ADDRESS = "0x0000000000000000000000000000000000000000"
# Product 2, NOT 1. scripts/deploy-merchant-terminal.ts prices product 2 at one
# 6-decimal unit and leaves product 1 at zero, so pointing here at 1 makes
# unitPrice() return 0 and every link reports "not payable right now" on a
# fresh deploy. The e2e fixture happens to price product 1, which hid this.
PRODUCT_ID = "2"
# Mainnet: pin the pay endpoint to your own origins.
# Leaving this empty makes corsHeaders fall back to "*", which lets any site
# call /api/pay and /api/relay-tx. Defensible for a public pay page, but it
# should be a deliberate choice at deploy time rather than a default nobody
# revisited. Set your own pay-page origins here before going live.
ALLOWED_ORIGINS = "https://pay.p2p.me"
# Mainnet gas is real money — start conservative and raise with observed
# volume rather than guessing high.
RATE_IP_PER_MINUTE = "10"
RATE_LINK_PER_HOUR = "20"
# In WEI — see the note on the default environment.
MAX_GAS_WEI_PER_TX = "1000000000000000"
MAX_GAS_WEI_PER_DAY = "5000000000000000"
# Sub-budgets, at the same 20% / 10% ratio as the default environment.
MAX_GAS_WEI_PER_MERCHANT_PER_DAY = "1000000000000000"
MAX_GAS_WEI_PER_LINK_PER_DAY = "500000000000000"
# Mainnet ships with the gate MANDATORY. Set the secret first:
#   wrangler secret put TURNSTILE_SECRET --env production
REQUIRE_TURNSTILE = "true"
GAS_BUFFER_PCT = "120"
LOW_BALANCE_WEI = "30000000000000000"
RECEIPT_TIMEOUT_MS = "45000"
LOG_SCAN_BLOCKS = "800"
WEBHOOK_BATCH = "50"
LINK_LOCK_SECONDS = "60"

# ─── Production bindings ──────────────────────────────────────────────
#
# These MUST be repeated. `kv_namespaces`, `durable_objects.bindings` and
# `migrations` are non-inheritable keys in wrangler: a named environment does
# not pick them up from the top level. Without this block
# `wrangler deploy --env production` ships a Worker where `env.KV` is
# undefined, so the first mainnet request dies in an uncaught TypeError and
# returns 500 with no CORS headers. Testnet works; mainnet is dead on arrival.
#
# Secrets are per-environment too — `wrangler secret put NAME --env production`.
# Without the flag they land on the default environment only.

[[env.production.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"

[[env.production.durable_objects.bindings]]
name = "LINK_LOCK"
class_name = "LinkLock"

[[env.production.durable_objects.bindings]]
name = "NONCE"
class_name = "NonceManager"

[[env.production.durable_objects.bindings]]
name = "GAS_BUDGET"
class_name = "GasBudget"

[[env.production.migrations]]
tag = "v1"
new_classes = ["LinkLock", "NonceManager", "GasBudget"]

# The scheduled run has to exist here too, or completions are never confirmed
# and no webhook is ever delivered on mainnet.
[env.production.triggers]
crons = ["*/5 * * * *"]
